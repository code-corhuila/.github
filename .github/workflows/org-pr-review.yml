name: Organization pull request review

# One central review for the whole organization.
#
# Sweeps every open pull request in code-corhuila, writes a review against the
# course standard and approves it. Student work is never blocked: the human
# control happens at the checkpoint defence, where the instructor contrasts
# this written analysis against what the team actually did with it.
#
# Two profiles:
#   *-docs  -> documentation review: completeness, consistency, traceability
#   others  -> code review: demanding gap analysis and misoriented decisions
#
# The model runs through Claude Code authenticated with the instructor's
# subscription (CLAUDE_CODE_OAUTH_TOKEN), so no API credits are consumed.
#
# This workflow NEVER checks out or executes any repository's code. It only
# reads metadata and diffs through the API, and runs the model in an empty
# working directory.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "Review only this repository (name without owner). Empty = whole org."
        required: false
      dry_run:
        description: "Generate reviews but do not post them"
        type: boolean
        default: false
      limit:
        description: "Maximum pull requests to review in this run"
        required: false
        default: "10"

permissions:
  contents: read

concurrency:
  group: org-pr-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Sweep open pull requests and review them
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Required: the repository-scoped GITHUB_TOKEN cannot read the
          # organization's private repositories, so the sweep needs this.
          TEACHER_TOKEN: ${{ secrets.TEACHER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY_REPO: ${{ inputs.repo }}
          DRY_RUN: ${{ inputs.dry_run }}
          PR_LIMIT: ${{ inputs.limit }}
        run: |
          # A token pasted from a wrapped terminal line can carry stray whitespace,
          # which makes the API reject it as invalid. Tokens never contain
          # whitespace, so removing it is safe and makes the secret paste-proof.
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          mkdir -p /tmp/review-workdir
          python3 - <<'PYTHON'
          import json, os, subprocess, tempfile, urllib.request, urllib.error

          ORG        = "code-corhuila"
          MODEL      = "claude-sonnet-5"
          MARKER     = "<!-- ai-review"
          WORKDIR    = "/tmp/review-workdir"
          MAX_FILES  = 60      # files whose diff is sent
          MAX_PATCH  = 1800    # characters of diff kept per file
          MAX_PROMPT = 240000

          GH   = os.environ.get("TEACHER_TOKEN") or os.environ["GITHUB_TOKEN"]
          ONLY = (os.environ.get("ONLY_REPO") or "").strip()
          DRY  = (os.environ.get("DRY_RUN") or "").lower() == "true"
          try:
              MAX_PRS = max(1, int(os.environ.get("PR_LIMIT") or 10))
          except ValueError:
              MAX_PRS = 10

          def gh(path, method="GET", payload=None):
              req = urllib.request.Request(
                  f"https://api.github.com/{path}", method=method,
                  data=json.dumps(payload).encode() if payload else None,
                  headers={"Authorization": f"Bearer {GH}",
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json",
                           "User-Agent": "org-pr-review"})
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read() or "{}")

          CLOSE = ("\n\n---\n\n**Approved.** This review never blocks the team: the pull "
                   "request is approved regardless of what is raised here. These findings are "
                   "recorded as a written trace. At the checkpoint defence you will be asked "
                   "what you did with each one — applied it and how, or did not apply it and "
                   "why. A reasoned decision not to follow a recommendation is acceptable; "
                   "not having considered it is not.")

          CLOSE_BEHIND = ("\n\n---\n\n**This branch has fallen behind `{base}`, so this "
                          "approval will not hold.** GitHub dismisses the approval of any "
                          "pull request whose branch is behind its base, within seconds of "
                          "it being given. Bring the branch up to date with `{base}` and "
                          "the approval stands on the next sweep. Nothing else is required.")

          CLOSE_SELF = ("\n\n---\n\n*Filed as a comment, not an approval: GitHub does not "
                        "allow approving one's own pull request. The findings above stand "
                        "exactly as they would in any other review.*")

          COMMON = """You are the instructor of the Distributed Systems course at CORHUILA,
          reviewing a student team's pull request. Produce ONLY the review text, with no
          preamble, no sign-off and no commentary about the task itself.

          WRITE THE ENTIRE REVIEW IN ENGLISH. Never in Spanish, whatever the language of the
          pull request, the code or the documentation.

          COURSE STANDARD you hold the work against:
          - Components are named `<abbr>-<domain>-<piece>` (piece = db, api, portal, app) or
            `<abbr>-<cross-cutting>` (api-gateway, worker, workflow, infra, front). Prefixes
            such as `ms-` or `svc-` are not the convention.
          - Documentation repositories (`-docs`) have ONE permanent branch, `main`, fed by
            `docs/` child branches.
          - Code repositories have three permanent branches: `develop`, `qa`, `main`. None
            accepts a direct commit. `develop` is fed by `feat/ fix/ chore/`, `qa` by `qa/`,
            `main` by `release/ hotfix/`.
          - Merging one permanent branch into another is PROHIBITED. Promotion happens by
            re-application with `git cherry-pick -x`; the `(cherry picked from commit ...)`
            trail is the only accepted evidence of traceability.
          - Each domain owns its own database, in its own instance. No shared database with
            separate schemas, no central migrations repository, and no service ever reads
            another domain's database.
          - The database structure lives in the `-db` repository, never in the `-api`.
          - The shared HTTP client and session handling live in `-front`, never duplicated in
            each `-portal` or `-app`.
          - Pull requests are capped at 400 changed lines, must carry a description, and their
            title must follow Conventional Commits.

          STYLE: direct and technical. No filler, no emoji, no praise for its own sake. Every
          point must name the concrete file, branch, decision or line it refers to, drawn from
          the diff you were given. Never invent a finding you cannot support from the diff.
          Do not add a closing note about approval: one is appended automatically."""

          DOCS_PROFILE = COMMON + """

          THIS IS A DOCUMENTATION REPOSITORY. Your recommendations must be about the
          DOCUMENTATION: completeness, internal consistency, contradictions between documents,
          traceability to user stories and decision records, naming, and pull request hygiene.
          Implementation advice belongs in the domain repositories. When a decision record omits
          something important, say the RECORD is missing it — do not instruct how to build it.

          FORMAT:
          - Open with "**Reviewed:**" and one paragraph on what the pull request actually
            contains, drawn from the real diff.
          - If the work is genuinely good, say so specifically and briefly.
          - Then "**Recommendations on this change:**" as a numbered list of 2 to 4 items.
          - Maximum 400 words."""

          CODE_PROFILE = COMMON + """

          THIS IS A CODE REPOSITORY, and the bar here is deliberately higher than for
          documentation. Argue the gaps. Name what is misoriented and why it is misoriented,
          not merely that it deviates from a rule. Go after:

          - Architectural misdirection: domain logic leaking into adapters, framework or
            persistence types reaching the domain, a use case that is really a controller,
            anaemic entities with the rules living elsewhere.
          - Boundary violations: cross-domain database access, schema living in the wrong
            repository, one service reaching into another's internals instead of its contract.
          - Correctness and failure modes: what happens on partial failure, on retry, on
            concurrent execution. Missing idempotency where an operation can run twice.
            Unhandled errors that will surface as silent data loss.
          - Security: credentials or secrets in the diff, missing authorization checks, trust
            placed in client-supplied values, tokens handled outside the shared layer.
          - Data: migrations that are not reversible or not idempotent, destructive changes
            without a stated recovery path, constraints the domain rules require but the schema
            does not enforce.
          - Contracts and tests: a published contract that does not match the implementation,
            behaviour asserted nowhere, tests that assert the implementation rather than the rule.
          - Traceability: branch, title and promotion trail against the course standard.

          Be concrete about consequence. "This is not idempotent" is weak; "a second pass over
          the same loan applies the fine twice, and nothing in the schema prevents it" is the
          standard. Where you are uncertain because the diff is partial, say so explicitly
          rather than asserting.

          FORMAT:
          - Open with "**Reviewed:**" and one paragraph on what the pull request actually
            changes.
          - "**Findings**" — a numbered list, most serious first, 3 to 6 items. For each: what
            is wrong, where, and what it causes. Mark each as Critical, Major or Minor.
          - "**What was done well**" — one or two lines, only if genuinely warranted.
          - Maximum 700 words."""

          def build_context(repo, pr, files):
              inv, diffs = [], []
              for i, f in enumerate(files):
                  inv.append(f"{f['filename']}  +{f['additions']}/-{f['deletions']}")
                  if i < MAX_FILES and f.get("patch"):
                      p = f["patch"]
                      if len(p) > MAX_PATCH:
                          p = p[:MAX_PATCH] + "\n... [diff truncated]"
                      diffs.append(f"--- {f['filename']} ---\n{p}")
              head = pr["head"]["repo"]
              fork = "no" if head and head["full_name"] == pr["base"]["repo"]["full_name"] else "YES"
              txt = (f"Repository: {ORG}/{repo}\n"
                     f"Pull request #{pr['number']}: {pr['title']}\n"
                     f"Author: {pr['user']['login']}\n"
                     f"Branch: {pr['head']['ref']} -> {pr['base']['ref']}\n"
                     f"From a fork: {fork}\n"
                     f"Size: {pr['changed_files']} files, +{pr['additions']}/-{pr['deletions']}\n"
                     f"Description:\n{(pr.get('body') or '(no description)')[:3000]}\n\n"
                     f"FILES CHANGED:\n" + "\n".join(inv) +
                     "\n\nDIFF:\n" + "\n\n".join(diffs))
              return txt[:MAX_PROMPT]

          def ask_model(system, context):
              prompt = system + "\n\n=== PULL REQUEST UNDER REVIEW ===\n\n" + context
              with tempfile.NamedTemporaryFile("w", suffix=".txt", delete=False,
                                               encoding="utf-8") as fh:
                  fh.write(prompt)
                  path = fh.name
              try:
                  with open(path, encoding="utf-8") as stdin:
                      p = subprocess.run(
                          ["claude", "--print", "--output-format", "text",
                           "--model", MODEL],
                          stdin=stdin, capture_output=True, text=True,
                          timeout=600, cwd=WORKDIR)
                  if p.returncode != 0:
                      print("  claude exit", p.returncode)
                      print("  stderr:", (p.stderr or "(empty)")[:800])
                      print("  stdout:", (p.stdout or "(empty)")[:800])
                      return None
                  out = (p.stdout or "").strip()
                  return out or None
              except subprocess.TimeoutExpired:
                  print("  claude timed out")
                  return None
              except Exception as e:
                  print("  claude invocation failed:", e)
                  return None
              finally:
                  try: os.unlink(path)
                  except OSError: pass

          # GitHub's own wording when it drops an approval by itself. Anything
          # else means a person dismissed the review on purpose.
          AUTO_DISMISS = ("merge-base changed", "stale", "dismissed automatically")

          def behind_base(repo, pr):
              """How many commits the head branch is behind its base.

              An approval cannot survive on a branch that has fallen behind:
              GitHub recomputes the test merge, finds the merge base recorded
              with the review stale, and dismisses it within about thirty
              seconds. Measured so the sweep does not start an hourly
              approve-and-dismiss loop against a branch that cannot hold one."""
              try:
                  c = gh(f"repos/{ORG}/{repo}/compare/"
                         f"{pr['base']['ref']}...{pr['head']['label']}")
                  return int(c.get("behind_by") or 0)
              except Exception:
                  return 0

          def auto_dismissed(repo, num):
              """True when GitHub, not a person, dropped the approval.

              A dismissal the instructor performed deliberately has to stand:
              re-approving it would quietly undo a human decision."""
              try:
                  tl = gh(f"repos/{ORG}/{repo}/issues/{num}/timeline?per_page=100")
              except Exception:
                  return False
              msgs = [(e.get("dismissed_review") or {}).get("dismissal_message") or ""
                      for e in tl if e.get("event") == "review_dismissed"]
              if not msgs:
                  return False
              return any(k in msgs[-1].lower() for k in AUTO_DISMISS)

          # ---- sweep -------------------------------------------------------
          if not os.environ.get("TEACHER_TOKEN"):
              print("TEACHER_TOKEN is not set: private repositories will not be visible.")
          if not os.environ.get("CLAUDE_CODE_OAUTH_TOKEN"):
              print("CLAUDE_CODE_OAUTH_TOKEN is not set — nothing to review.")
              raise SystemExit(0)

          q = f"org:{ORG}+is:pr+is:open+draft:false"
          if ONLY:
              q = f"repo:{ORG}/{ONLY}+is:pr+is:open+draft:false"
          # The search endpoint caps a page at 100 results. Once the org holds
          # more open pull requests than that, a single page silently hides the
          # newest ones from every run, forever. Walk the pages.
          items, page = [], 1
          while True:
              found = gh(f"search/issues?q={q}&sort=created&order=asc"
                         f"&per_page=100&page={page}")
              batch = found.get("items", [])
              if page == 1:
                  print(f"open pull requests found: {found.get('total_count', 0)}")
              items.extend(batch)
              # The search API refuses to page past 1000 results.
              if len(batch) < 100 or len(items) >= 1000:
                  break
              page += 1
          print(f"pull requests swept: {len(items)}")

          # GitHub rejects approving your own pull request, so the instructor's
          # own ones are filed as a comment review instead.
          try:
              SELF = (gh("user") or {}).get("login") or ""
          except Exception:
              SELF = ""
          if not SELF:
              print("the bot's own account could not be resolved; reinstatement is "
                    "disabled for this run.")

          done = 0
          for item in items:
              if done >= MAX_PRS:
                  print("per-run limit reached; the rest are picked up next run.")
                  break
              repo = item["repository_url"].rsplit("/", 1)[-1]
              num = item["number"]
              try:
                  pr = gh(f"repos/{ORG}/{repo}/pulls/{num}")
                  head_sha = pr["head"]["sha"][:12]
                  reviews = gh(f"repos/{ORG}/{repo}/pulls/{num}/reviews?per_page=100")
                  marked = [r for r in reviews
                            if MARKER in (r.get("body") or "")
                            and head_sha in (r.get("body") or "")]
                  # Only this account's own reviews are trusted. Anyone with write
                  # access on the repository could otherwise paste the marker into a
                  # review of their own and have that text reinstated as an approval
                  # under the instructor's name.
                  prior = [r for r in marked
                           if ((r.get("user") or {}).get("login") or "").lower()
                           == SELF.lower()] if SELF else marked
                  # A review that still counts means this head is handled. A
                  # DISMISSED one counts for nothing: GitHub wipes the approval on
                  # every open pull request whenever the base branch moves, and
                  # keying the skip on the head alone left those blocked forever —
                  # the head does not change when a review is dismissed.
                  if any((r.get("state") or "").upper() != "DISMISSED" for r in prior):
                      continue
                  if not SELF and marked:
                      # The bot's own account could not be resolved, so its reviews
                      # cannot be told apart from anyone else's. Stay with the old,
                      # conservative skip rather than reinstating text that may not
                      # be ours.
                      continue
                  if prior and not auto_dismissed(repo, num):
                      print(f"  {repo}#{num} — dismissed by a person; left as it is.")
                      continue
                  mine = bool(SELF) and pr["user"]["login"].lower() == SELF.lower()
                  is_docs = repo.endswith("-docs")
                  behind = behind_base(repo, pr)
                  if prior:
                      if behind:
                          # Reinstating here would only be dismissed again within
                          # seconds, every hour, forever. The review already on the
                          # pull request says what the team has to do.
                          print(f"  {repo}#{num} — {behind} behind "
                                f"{pr['base']['ref']}; an approval cannot hold until "
                                f"the branch is updated. Left as it is.")
                          continue
                      # Same head: the team's work is byte for byte what was already
                      # reviewed, so the text is reinstated rather than regenerated.
                      # Re-running the model here would spend subscription quota on
                      # a diff that has not changed.
                      body = prior[-1]["body"]
                      print(f"[reinstate] {repo}#{num} — approval was auto-dismissed")
                  else:
                      files = gh(f"repos/{ORG}/{repo}/pulls/{num}/files?per_page=100")
                      print(f"[{'docs' if is_docs else 'code'}] {repo}#{num} — "
                            f"{pr['changed_files']} files")
                      body = ask_model(DOCS_PROFILE if is_docs else CODE_PROFILE,
                                       build_context(repo, pr, files))
                      if not body:
                          body = ("**Reviewed:** the automated review could not be generated "
                                  "for this pull request. It is approved so the team is not "
                                  "blocked; it will be reviewed manually.")
                      body = (f"{MARKER}:{head_sha} -->\n\n{body}"
                              + (CLOSE_SELF if mine else CLOSE)
                              + (CLOSE_BEHIND.format(base=pr["base"]["ref"])
                                 if behind else ""))
                  if DRY:
                      print("  dry run — not posted\n" + body)
                  else:
                      try:
                          # A COMMENT review still lands in the reviews list, so the
                          # marker is found next run. The old fallback wrote an issue
                          # comment, which the skip never sees: the instructor's own
                          # pull request was re-reviewed every hour, forever, and ate
                          # the run's budget.
                          event = "COMMENT" if mine else "APPROVE"
                          gh(f"repos/{ORG}/{repo}/pulls/{num}/reviews", method="POST",
                             payload={"event": event, "body": body})
                          print("  commented (own pull request)" if mine
                                else "  approved")
                      except urllib.error.HTTPError as e:
                          print("  approve failed:", e.code,
                                e.read()[:200].decode("utf-8", "replace"))
                          gh(f"repos/{ORG}/{repo}/issues/{num}/comments", method="POST",
                             payload={"body": body})
                          print("  posted as a comment instead")
                  done += 1
              except urllib.error.HTTPError as e:
                  print(f"  {repo}#{num} skipped: {e.code}")
              except Exception as e:
                  print(f"  {repo}#{num} skipped: {e}")

          print(f"reviewed this run: {done}")
          PYTHON
